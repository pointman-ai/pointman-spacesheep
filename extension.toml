# Spacesheep: a behaviour, and Talk through the node. Its CLI is how Spacesheep prefers to be installed, so agents
# publish with `npx -y spacesheep@latest`, not through an MCP server. Installed on a node, the behaviour goes into
# every run there, with its rules in each run's allowed tools.
#
# Signing in (EXT-132): the CLI keeps one key per machine (~/.config/spacesheep). `/spacesheep add` seals one API key
# in the vault, and each node that isn't signed in mints a key of its own with it (`keys create`, then `keys save`),
# so one add signs in every node. A machine signed in by hand keeps its own key.
#
# Talk (Pointman thread 6914; the spec: https://spacesheep.dev/@james/spacesheep-talk-through-the-pointman-node): a
# page's Session tab on spacesheep.dev messages the agent session that published it. While the account's Talk switch
# is on, the process runs `spacesheep talk listen --session <id>` for each agent here whose session published a page,
# and posts each message in the page's thread (the one it was published from), which wakes the agent: or wakes the
# agents the message starts by calling (`@editor …`), James's call in thread 6914 [16235]. The agent answers there,
# and on the page with `spacesheep talk reply`. The node names no extension: its `agents.sessions` and `board.post` are generic. Nothing
# changes on Spacesheep's side, and nothing goes into ~/.claude.

[extension]
id = "spacesheep"
name = "Spacesheep"
version = "0.9.2"
publisher = "aurelio"
summary = "Publish pages and sites to Spacesheep from any agent, with its CLI, and talk to an agent from its page's Session tab."
node = ">=0.4,<1"
platforms = ["macos-arm64", "macos-x86_64", "linux-x86_64", "linux-arm64"]
# its robot account's face (@spacesheep, Pointman's EXT-85): the Spacesheep sheep
avatar = "avatar.png"

[run]
command = ["bin/spacesheep"]
runtime = "binary"

[behavior]
skill = "SKILL.md"
files = ["references"]           # how to write a page (pages.md), its checker (check.py) and a starter (template.html)

[permissions]
rules = ["Bash(spacesheep:*)", "Bash(npx -y spacesheep@latest:*)"]
network = true                   # spacesheep.dev, through its CLI
agents = true                    # agents.sessions: each agent's session and latest thread
post = true                      # board.post: each message, as a post in the agent's thread
secrets = ["spacesheep.key"]     # the API key that signs each node in (EXT-132); only ever in the CLI's environment

[[credentials]]
id = "key"
title = "Spacesheep API key"
help = "On spacesheep.dev: Settings › API keys › Create (ss_…). Each node that isn't signed in uses it to make a key of its own, named after the machine."
item = "spacesheep.key"
value = "ss_[A-Za-z0-9]{16,200}"
placeholder = "ss_…"
needed = 0                       # a machine signed in by hand needs none; health's account part asks when one isn't

# `/spacesheep add`: the apps open the key's form above and seal it in the vault as spacesheep.key. No name: the
# extension opens only that one item.
[[commands]]
kind = "spacesheep.add"
title = "Add a Spacesheep API key"
params = { type = "object", properties = {}, additionalProperties = false }
slash = "add"
form = "key"
summary = "Add a Spacesheep API key: each node that isn't signed in signs itself in with a key of its own"

[[events]]
name = "spacesheep.talk"
description = "Talk on or off for the account, the agents listened for, and when the last message came."

# A page's link in a post is a pill in the apps while the workspace runs Spacesheep. Core doesn't look
# pages up, so its title is the page's name in the link.
[[links]]
kind = "page"
match = "https://spacesheep.dev/@{owner}/{space}"
show = ["title"]
