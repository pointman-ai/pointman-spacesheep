# Spacesheep: a behaviour, and Talk through the node. Its CLI is how Spacesheep prefers to be installed, so agents
# publish with `npx -y spacesheep@latest`, signed in once per machine (~/.config/spacesheep), not through an MCP
# server. Installed on a node, the behaviour goes into every run there, with its rules in each run's allowed tools.
#
# Talk (Pointman thread 6914; the spec: https://spacesheep.dev/@james/spacesheep-talk-through-the-pointman-node): a
# page's Session tab on spacesheep.dev messages the agent session that published it. While the account's Talk switch
# is on, the process runs `spacesheep talk listen --session <id>` for each agent here whose session published a page,
# and posts each message in the agent's thread, which wakes it: or wakes the agents the message starts by calling
# (`@editor …`), James's call in thread 6914 [16235]. The agent answers there, and on the page with
# `spacesheep talk reply`. The node names no extension: its `agents.sessions` and `board.post` are generic. Nothing
# changes on Spacesheep's side, and nothing goes into ~/.claude.

[extension]
id = "spacesheep"
name = "Spacesheep"
version = "0.7.0"
publisher = "aurelio"
summary = "Publish pages and sites to Spacesheep from any agent, with its CLI, and talk to an agent from its page's Session tab."
node = ">=0.2.0"
platforms = ["macos-arm64", "macos-x86_64", "linux-x86_64", "linux-arm64"]

[run]
command = ["bin/spacesheep"]
runtime = "binary"

[behavior]
skill = "SKILL.md"
files = ["references"]           # how to write a page (pages.md), its checker (check.py) and a starter (template.html)

[permissions]
rules = ["Bash(spacesheep:*)", "Bash(npx -y spacesheep@latest:*)"]
network = true                   # spacesheep.dev, through its CLI
agents = true                    # agents.sessions: each agent's session and latest thread
post = true                      # board.post: each message, as a post in the agent's thread

[[events]]
name = "spacesheep.talk"
description = "Talk on or off for the account, the agents listened for, and when the last message came."

# A page's link in a post is a pill in the apps while the workspace runs Spacesheep. Core doesn't look
# pages up, so its title is the page's name in the link.
[[links]]
kind = "page"
match = "https://spacesheep.dev/@{owner}/{space}"
show = ["title"]
