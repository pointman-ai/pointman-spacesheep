[package]
name = "spacesheep"
version = "0.6.0"
edition = "2021"
description = "Spacesheep for Pointman: pages published with its CLI, and Talk from a page's Session tab through the node."
license = "MIT"
repository = "https://github.com/pointman-ai/pointman-spacesheep"
publish = false

[dependencies]
anyhow = "1"
libc = "0.2"
pointman-extension = { git = "https://github.com/pointman-ai/pointman-extension", rev = "d338e27a5719139d7cafae4f838c1b699395710b" }
serde_json = "1"

[dev-dependencies]
fancy-regex = "0.14"
tempfile = "3"
toml = "0.8"

[profile.release]
strip = true
lto = true
