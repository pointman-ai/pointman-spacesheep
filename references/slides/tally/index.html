<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="ss-streams" content="tally/room">
<title>Who's in the room</title>
<!--
  A live slide: the room's show of hands, by group, next to the online count.
  Data: {title, groups: [{label, room, online}], updated_at}.
  It is drawn from two places, whichever is newer:
  - the stream named in ss-streams above (Spacesheep streams): open tabs redraw in place, no reload;
  - the JSON block below (tally-data), saved with each update, for tabs opened later
    (a stream only keeps its last 10 minutes).
  Set it with tally-set (beside this file). A second slide on the same account needs its own stream name:
  change it in ss-streams and pass the same name to tally-set as TALLY_STREAM.
-->
<style>
:root{
  --bg:#fff; --ink:#1b1b22; --ink2:#46464f; --muted:#6a6a73; --line:#e3e3e8; --track:#f0f0f4;
  --room:#2563eb; --online:#c2410c;
  --u:min(1vw, 1.7778vh);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121317; --ink:#e8e9ee; --ink2:#c2c4cc; --muted:#9a9ca6; --line:#2c2e36; --track:#1d1f26;
    --room:#7aa7ff; --online:#fb923c;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:calc(var(--u)*1.6)/1.3 ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
.slide{height:100vh;width:100%;max-width:calc(100vh*1.7778);margin:0 auto;padding:calc(var(--u)*3.2) calc(var(--u)*4.2) calc(var(--u)*4.4);display:grid;grid-template-rows:auto 1fr auto;gap:calc(var(--u)*2.2)}
header{display:grid;grid-template-columns:1fr auto;align-items:end;gap:calc(var(--u)*3)}
.kicker{margin:0 0 calc(var(--u)*.6);font-size:calc(var(--u)*1.5);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:650}
h1{margin:0;font-size:calc(var(--u)*4.6);line-height:1.05;letter-spacing:-.015em}
.total{text-align:right}
.total .n{display:block;font-size:calc(var(--u)*9.5);font-weight:800;line-height:.95;letter-spacing:-.03em}
.total .l{display:block;font-size:calc(var(--u)*1.7);color:var(--ink2);margin-top:calc(var(--u)*.4)}
.chart{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1fr) minmax(0,1fr);grid-auto-rows:minmax(0,1fr);column-gap:calc(var(--u)*2.4);border-top:2px solid var(--line);padding-top:calc(var(--u)*1.2);min-height:0}
.colh{align-self:end;font-size:calc(var(--u)*1.9);font-weight:700;padding-bottom:calc(var(--u)*.6);display:flex;align-items:baseline;gap:calc(var(--u)*.8)}
.colh i{display:inline-block;width:calc(var(--u)*1.4);height:calc(var(--u)*1.4);border-radius:3px;align-self:center}
.colh.room i{background:var(--room)} .colh.online i{background:var(--online)}
.colh b{font-weight:800}
.label{align-self:center;font-size:calc(var(--u)*2.6);font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.cell{align-self:center;display:grid;grid-template-columns:1fr calc(var(--u)*6.5);align-items:center;gap:calc(var(--u)*1)}
.track{height:min(calc(var(--u)*4.4), 70%);min-height:calc(var(--u)*1.6);background:var(--track);border-radius:calc(var(--u)*.5);overflow:hidden;position:relative}
.cell{height:100%}
.bar{position:absolute;inset:0 auto 0 0;width:0;border-radius:calc(var(--u)*.5);transition:width .5s ease}
.room .bar{background:var(--room)} .online .bar{background:var(--online)}
.val{font-size:calc(var(--u)*3.4);font-weight:800;text-align:right;line-height:1}
.empty{grid-column:1/-1;align-self:center;text-align:center;font-size:calc(var(--u)*3);color:var(--muted)}
footer{display:flex;justify-content:space-between;align-items:baseline;font-size:calc(var(--u)*1.6);color:var(--muted)}
footer .upd b{color:var(--ink2);font-weight:700}
@media (prefers-reduced-motion: reduce){.bar{transition:none}}
@media (max-width:640px){
  :root{--u:min(1.9vw, 1.7778vh)}
  .slide{height:auto;min-height:100vh;padding:20px 16px}
  .chart{grid-auto-rows:auto;row-gap:12px}
  .track{height:20px}
}
</style>
</head>
<body>
<main class="slide" aria-live="polite">
  <header>
    <div>
      <p class="kicker">Show of hands · live</p>
      <h1 id="title" data-ss-id="title">Who's in the room</h1>
    </div>
    <div class="total" data-ss-id="total">
      <span class="n" id="total">0</span>
      <span class="l" id="split">0 in the room · 0 online</span>
    </div>
  </header>
  <section class="chart" id="chart" role="img" aria-label="Bars: each group's count in the room and online" data-ss-id="chart">
    <div></div>
    <div class="colh room"><i></i>In the room <b id="room-total">0</b></div>
    <div class="colh online"><i></i>Online <b id="online-total">0</b></div>
  </section>
  <footer>
    <span class="upd">Updated <b><time id="updated" datetime="">—</time></b></span>
    <span id="note">Each column's bars are to its own scale</span>
  </footer>
</main>

<script type="application/json" id="tally-data" data-ss-id="tally-data">{"title":"Who's in the room","groups":[],"updated_at":"1970-01-01T00:00:00Z"}</script>

<script>
(function () {
  var STREAM = document.querySelector('meta[name="ss-streams"]').content;
  var chart = document.getElementById("chart");
  var cur = null;
  var rows = []; // [{label, room, online}] elements, reused so an update never rebuilds the slide

  function num(x) { x = Number(x); return isFinite(x) && x > 0 ? Math.round(x) : 0; }
  function stamp(d) { var t = Date.parse(d && d.updated_at); return isFinite(t) ? t : 0; }
  function fmt(n) { return n.toLocaleString(); }

  function el(cls, parent) { var e = document.createElement("div"); e.className = cls; parent.appendChild(e); return e; }
  function cell(kind) {
    var c = el("cell " + kind, chart), tr = el("track", c), bar = el("bar", tr), v = el("val", c);
    return { c: c, bar: bar, v: v };
  }

  var loaded = new Date();
  function hms(t) { return t.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }); }
  function render(d) {
    var groups = (d && d.groups) || [];
    document.getElementById("title").textContent = (d && d.title) || "Who's in the room";
    var room = 0, online = 0, maxR = 0, maxO = 0, i;
    for (i = 0; i < groups.length; i++) {
      var r = num(groups[i].room), o = num(groups[i].online);
      room += r; online += o; if (r > maxR) maxR = r; if (o > maxO) maxO = o;
    }
    // Rows: add or remove only what changed, then set the numbers in place.
    var empty = chart.querySelector(".empty");
    if (!groups.length && !empty) { empty = el("empty", chart); empty.textContent = "Waiting for the first count"; }
    if (groups.length && empty) empty.remove();
    while (rows.length > groups.length) { var x = rows.pop(); x.label.remove(); x.room.c.remove(); x.online.c.remove(); }
    while (rows.length < groups.length) rows.push({ label: el("label", chart), room: cell("room"), online: cell("online") });
    for (i = 0; i < groups.length; i++) {
      var g = groups[i], row = rows[i], gr = num(g.room), go = num(g.online);
      var lab = String(g.label == null ? "" : g.label);
      if (row.label.textContent !== lab) row.label.textContent = lab;
      row.room.v.textContent = fmt(gr);
      row.online.v.textContent = fmt(go);
      row.room.bar.style.width = (maxR ? gr / maxR * 100 : 0) + "%";
      row.online.bar.style.width = (maxO ? go / maxO * 100 : 0) + "%";
    }
    chart.style.gridTemplateRows = "auto repeat(" + Math.max(groups.length, 1) + ", minmax(0,1fr))";
    document.getElementById("total").textContent = fmt(room + online);
    document.getElementById("split").textContent = fmt(room) + " in the room · " + fmt(online) + " online";
    document.getElementById("room-total").textContent = fmt(room);
    document.getElementById("online-total").textContent = fmt(online);
    var t = document.getElementById("updated"), ts = stamp(d);
    if (ts) {
      t.setAttribute("datetime", new Date(ts).toISOString());
      t.textContent = hms(new Date(ts));
    } else { t.removeAttribute("datetime"); t.textContent = "—"; }
    // A test value (debug: true) says how long after it was set it reached the screen, and when this tab loaded.
    var note = document.getElementById("note");
    if (d && d.debug && ts) note.textContent = "Test: on screen " + ((Date.now() - ts) / 1000).toFixed(2) + " s after it was set · tab loaded " + hms(loaded);
    else note.textContent = "Each column's bars are to its own scale";
  }

  // Draw a value only if it is at least as new as what's on screen.
  function offer(d) {
    if (!d || typeof d !== "object" || !Array.isArray(d.groups)) return;
    if (cur && stamp(d) < stamp(cur)) return;
    if (cur && JSON.stringify(d) === JSON.stringify(cur)) return;
    cur = d; render(d);
  }
  function saved() {
    try { return JSON.parse(document.getElementById("tally-data").textContent); } catch (e) { return null; }
  }

  render({ groups: [] });
  offer(saved());
  if (window.ss && window.ss.stream) window.ss.stream(STREAM).draw(function (v) { offer(v); });
  // A saved update announced to open tabs (a live patch) changes the JSON block in place.
  document.addEventListener("ss:live", function () { offer(saved()); });
})();
</script>
</body>
</html>
